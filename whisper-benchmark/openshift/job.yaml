apiVersion: batch/v1
kind: Job
metadata:
  name: whisper-benchmark-job
  labels:
    app: whisper-benchmark
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: whisper-benchmark
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: quay.io/rh-aiservices-bu/whisper-vllm-benchmarking:2025-07-21
          imagePullPolicy: Always
          env:
            - name: OPENAI_API_KEY
              value: "EMPTY"
            - name: OPENAI_API_BASE_URL
              value: "http://whisper-serving:8000"
            - name: TARGET_MODEL_NAME
              value: "openai/whisper-large-v2"
            - name: LANGUAGE
              value: "en"
            - name: CONCURRENT_REQUESTS
              value: "32"
            - name: DATASET_NAME
              value: "/tmp/dante_dataset"
            - name: RESULTS_DIR
              value: "/results"
            - name: MODEL_DIR
              value: "/mnt/models"
            - name: HF_HOME
              value: "/opt/hf_home"
            - name: WER_SCRIPT_PATH
              value: "/mnt/models/wer.py"
          volumeMounts:
            - name: tokenizer-volume
              mountPath: /mnt/models
            - name: wer-script-volume
              mountPath: /mnt/wer-script
            - name: results-volume
              mountPath: /results
            - name: shm
              mountPath: /dev/shm
          command:
            - /bin/bash
            - -c
          # Need to move the files into a location that is accessible to the user in the container
          # Paths: /opt/hf_home/hub/datasets--D4nt3--esb-datasets-earnings22-validation-tiny-filtered/blobs/ce8ad64479c22d3c5d5bf8e952b460f6892c5df7a02f9bee2b2ecd654c2442bd -> /tmp/dante_dataset/data/validation-00000-of-00001.parquet
          # Paths: /opt/hf_home/hub/datasets--D4nt3--esb-datasets-earnings22-validation-tiny-filtered/blobs/2491087408f3e33eb425496aeb5ecafb39984754 -> /tmp/dante_dataset/README.md
          # These are paths within the container itself
          # Also need to apply a certain set of changes to the dataset loading code so that the dataset is loaded as a local file instead of 
          # attempting to download it from huggingface
          args:
            - |
              echo $(whoami)
              echo "Moving dataset to accessible location"
              mkdir -p /tmp/dante_dataset/data
              cp -r /opt/hf_home/hub/datasets--D4nt3--esb-datasets-earnings22-validation-tiny-filtered/blobs/ce8ad64479c22d3c5d5bf8e952b460f6892c5df7a02f9bee2b2ecd654c2442bd /tmp/dante_dataset/data/validation-00000-of-00001.parquet
              cp -r /opt/hf_home/hub/datasets--D4nt3--esb-datasets-earnings22-validation-tiny-filtered/blobs/2491087408f3e33eb425496aeb5ecafb39984754 /tmp/dante_dataset/README.md
              echo "Checking if dataset is accessible"
              ls -la /tmp/dante_dataset/data/validation-00000-of-00001.parquet
              ls -la /tmp/dante_dataset/README.md
              echo "Dataset moved to accessible location"

              echo "Moving the code to a location that is accessible to the user in the container"
              mkdir -p /tmp/whisper_benchmark
              cp -r /opt/whisper_benchmark/* /tmp/whisper_benchmark/
              echo "Checking if code is accessible"
              ls -la /tmp/whisper_benchmark/

              echo "Updating the dataset loading code to use the environment variable DATASET_NAME"
              sed -i 's|^DATASET_NAME = "D4nt3/esb-datasets-earnings22-validation-tiny-filtered"|DATASET_NAME = "D4nt3/esb-datasets-earnings22-validation-tiny-filtered" if os.getenv("DATASET_NAME") is None else os.getenv("DATASET_NAME")|' /tmp/whisper_benchmark/vllm_streaming_openai_client.py

              echo "Updating the helpers.py code to use the new wer.py file"
              sed -i "s|wer = evaluate.load(\"wer\")|wer = evaluate.load(\"/mnt/wer-script/wer.py\")|" /tmp/whisper_benchmark/helpers.py

              echo "Checking if dataset loading code is updated"
              cat /tmp/whisper_benchmark/vllm_streaming_openai_client.py
              
              echo "Starting benchmark..."
              echo "Checking connectivity to $OPENAI_API_BASE_URL..."
              echo "Using model from $MODEL_DIR"
              echo "Using results directory $RESULTS_DIR"
              echo "Using concurrent requests $CONCURRENT_REQUESTS"
              echo "Using language $LANGUAGE"
              echo "Using target model name $TARGET_MODEL_NAME"
              # Test connectivity with timeout
              if ! curl -f --connect-timeout 30 --max-time 60 "${OPENAI_API_BASE_URL}/health" > /dev/null 2>&1; then
                echo "ERROR: Cannot reach Whisper API endpoint at $OPENAI_API_BASE_URL"
                echo "Please ensure the whisper-serving deployment is running and accessible"
                exit 1
              fi
              
              echo "✓ Successfully connected to Whisper API endpoint"
              echo "Starting benchmark execution..."
              python /tmp/whisper_benchmark/vllm_streaming_openai_client.py | tee -a /results/benchmark.log
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
      volumes:
        - name: wer-script-volume
          persistentVolumeClaim:
            claimName: whisper-wer-script
        - name: tokenizer-volume
          persistentVolumeClaim:
            claimName: whisper-large-v2-cache-1
        - name: results-volume
          persistentVolumeClaim:
            claimName: whisper-results
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi